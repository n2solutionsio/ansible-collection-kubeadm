---
# Kubernetes minor version. Drives both the pkgs.k8s.io apt repository and the
# version the staged packages are pulled from. pkgs.k8s.io publishes a separate
# repo per minor, so this is not cosmetic -- changing it changes the source.
#
# Defaults to 1.33 to match the homelab k3s cluster, so a single kubectl works
# against both (skew policy tolerates +/-1 minor).
node_prep_k8s_version: "1.33"

# Pin an exact package version, e.g. "1.33.4-1.1". Empty installs whatever the
# repo currently holds for the minor above. Pin this before a demo so a repo
# refresh cannot change what you staged.
node_prep_k8s_package_version: ""

# Pause image kubelet uses for sandboxes. Must match what `kubeadm config images
# list` reports for your version, or kubelet and kubeadm disagree and pods stay
# stuck at creation. 3.10 is correct for 1.31+.
node_prep_sandbox_image: "registry.k8s.io/pause:3.10"

# --- containerd -------------------------------------------------------------
node_prep_containerd_package: containerd.io
node_prep_containerd_version: ""          # e.g. "1.7.27-1"; empty = repo latest
node_prep_docker_repo_url: "https://download.docker.com/linux/ubuntu"

# --- staging ----------------------------------------------------------------
# Where .deb packages are downloaded to. Deliberately NOT installed -- see the
# role's README. Kick the install off yourself with the command written to
# node_prep_notes_path.
node_prep_staging_dir: /opt/kubeadm-staging
node_prep_notes_path: /opt/kubeadm-staging/INSTALL-NOTES.md

# Packages staged for manual installation.
#
# cri-tools is listed explicitly because nothing pulls it in: kubeadm's Depends
# field is empty, and kubelet depends only on iptables, kubernetes-cni, mount,
# util-linux and libc6. Relying on apt to resolve the Kubernetes toolchain gets
# you kubernetes-cni and nothing else.
node_prep_staged_packages:
  - kubelet
  - kubeadm
  - kubectl
  - cri-tools

# --- eBPF / CNI groundwork --------------------------------------------------
# Deliberately CNI-agnostic. These make an eBPF CNI (Cilium, Calico's eBPF
# dataplane) possible without choosing one, and are inert for CNIs that do not
# use eBPF -- so leaving them on costs nothing.

# Mount bpffs at /sys/fs/bpf and persist it. Cilium requires it.
node_prep_mount_bpffs: true

# Fail early if the host is not on the unified cgroup hierarchy. Ubuntu 24.04
# already is; this exists so a host that is not fails here rather than as an
# opaque eBPF error much later.
node_prep_require_cgroup_v2: true

# Images to pull into containerd's k8s.io namespace before bootstrap. Empty
# commits to nothing. Populate to pre-stage a CNI, e.g.:
#
#   node_prep_prepull_images:
#     - quay.io/cilium/cilium:v1.19.1
#     - quay.io/cilium/operator-generic:v1.19.1
#
# Note this does NOT cover the control-plane images kubeadm pulls
# (kube-apiserver, etcd, coredns, ...). Their canonical list comes from
# `kubeadm config images list`, which needs kubeadm installed -- so that stays
# out of scope for a role that deliberately does not install it.
node_prep_prepull_images: []

# Pull the pause image now rather than during kubeadm init.
node_prep_prepull_sandbox_image: true

# --- toggles ----------------------------------------------------------------
node_prep_disable_swap: true
node_prep_configure_kernel: true
node_prep_install_containerd: true
node_prep_stage_packages: true

# Extra packages every node gets.
#
# conntrack and socat are OS-level prerequisites, not Kubernetes binaries, so
# they are installed rather than staged -- installing them does not cross the
# "no Kubernetes installed" line this role holds. Neither is pulled in
# automatically: kubeadm declares no dependencies at all, and kubelet does not
# list them. kubeadm init's preflight checks fail without conntrack, and
# kubectl port-forward needs socat.
#
# nfs-common is here because its absence has bitten this homelab before -- pods
# with NFS PVCs fail to mount with a message that does not mention the missing
# client.
node_prep_extra_packages:
  - nfs-common
  - conntrack
  - socat
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
