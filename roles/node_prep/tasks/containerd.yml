---
- name: Ensure apt keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Fetch Docker apt signing key
  ansible.builtin.get_url:
    url: "{{ node_prep_docker_repo_url }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Configure Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      {{ node_prep_docker_repo_url }}
      {{ ansible_facts['distribution_release'] }} stable
    filename: docker
    state: present
    update_cache: true

- name: Install containerd
  ansible.builtin.apt:
    name: >-
      {{ node_prep_containerd_package }}{{
        '=' ~ node_prep_containerd_version if node_prep_containerd_version | length > 0 else ''
      }}
    state: present

- name: Ensure containerd config directory exists
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Read the current containerd config
  ansible.builtin.slurp:
    src: /etc/containerd/config.toml
  register: node_prep_containerd_current
  failed_when: false

# The containerd.io package ships a stub config -- a licence header and
# `disabled_plugins = ["cri"]` -- not a full default. Testing only for the
# file's existence therefore skips generation and leaves CRI switched off, so
# kubelet cannot reach the runtime at all and kubeadm fails with "container
# runtime is not running". Detect the stub by the absence of SystemdCgroup,
# which only a real generated config contains.
- name: Detect a stub or missing containerd config
  ansible.builtin.set_fact:
    node_prep_containerd_needs_default: >-
      {{ node_prep_containerd_current.content is not defined
         or 'SystemdCgroup' not in (node_prep_containerd_current.content | b64decode) }}

# Generated rather than templated: the config schema has changed across
# containerd majors (v2 moved to config version 3), and a hand-written template
# silently drifts. Generate the default this binary understands, then edit the
# two values kubeadm cares about.
- name: Generate default containerd config
  when: node_prep_containerd_needs_default | bool
  ansible.builtin.shell:
    cmd: containerd config default > /etc/containerd/config.toml
  changed_when: true
  notify: Restart containerd

# The single most common kubeadm failure: kubelet uses the systemd cgroup
# driver, containerd defaults to cgroupfs, and the mismatch surfaces much later
# as pods stuck in ContainerCreating rather than as an obvious error here.
- name: Use the systemd cgroup driver
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: '^(\s*)SystemdCgroup\s*=\s*false\s*$'
    replace: '\1SystemdCgroup = true'
  notify: Restart containerd

- name: Pin the sandbox image
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: '^(\s*)sandbox_image\s*=\s*".*"$'
    replace: '\1sandbox_image = "{{ node_prep_sandbox_image }}"'
  notify: Restart containerd

- name: Enable and start containerd
  ansible.builtin.systemd_service:
    name: containerd
    state: started
    enabled: true
    daemon_reload: true

# Both checks read the file rather than trusting the replace tasks above: a
# `replace` whose regexp matches nothing reports ok, not failed, so a silently
# ineffective edit looks identical to a successful one.
- name: Read the containerd config back
  ansible.builtin.slurp:
    src: /etc/containerd/config.toml
  register: node_prep_containerd_final

- name: Verify containerd is usable by kubelet
  ansible.builtin.assert:
    that:
      - "'SystemdCgroup = true' in node_prep_containerd_final.content | b64decode"
      - "'\"cri\"' not in (node_prep_containerd_final.content | b64decode
         | regex_search('disabled_plugins\\s*=\\s*\\[[^\\]]*\\]') | default('', true))"
    fail_msg: >-
      /etc/containerd/config.toml is not usable by kubelet. It needs
      'SystemdCgroup = true' and must not list "cri" in disabled_plugins. The
      containerd.io package ships a stub with CRI disabled; if this fires, the
      default config was not generated over it.
    quiet: true

# Flush the restart handler before pulling: ctr talks to the running daemon, and
# a config change still sitting in a pending handler means we would be talking
# to containerd with stale settings.
- name: Apply pending containerd restarts before pulling
  when: node_prep_prepull_sandbox_image | bool
  ansible.builtin.meta: flush_handlers

- name: Pre-pull the sandbox image
  when: node_prep_prepull_sandbox_image | bool
  vars:
    node_prep_prepull_images: ["{{ node_prep_sandbox_image }}"]
  ansible.builtin.include_tasks: images.yml
